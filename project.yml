name: Parrot
options:
  bundleIdPrefix: com.parrot
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    minorVersion: 1.1.1
targets:
  Parrot:
    type: application
    platform: macOS
    sources:
      - path: Parrot
    dependencies:
      - package: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parrot.app
        PRODUCT_NAME: Parrot
        INFOPLIST_FILE: Parrot/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Parrot/Resources/Parrot.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Parrot Self-Signed"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_DEBUG_DYLIB: NO
        OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
  ParrotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ParrotTests
    dependencies:
      - target: Parrot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parrot.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Parrot.app/Contents/MacOS/Parrot"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Parrot Self-Signed"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Parrot:
    build:
      targets:
        Parrot: all
        ParrotTests: [test]
    test:
      targets:
        - ParrotTests
